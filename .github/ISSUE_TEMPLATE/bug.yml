name: Something isn't working
description: Report a bug in the app
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari, installed app
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
