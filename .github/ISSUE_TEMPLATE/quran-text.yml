name: Qur'an text or boundary
description: Report a possible error in the text, a rub', juz or page boundary
labels: [quran-data]
body:
  - type: input
    id: where
    attributes:
      label: Surah and ayah
      placeholder: e.g. 15:49
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: Please name the printed mushaf you are comparing with (e.g. Madani mushaf, King Fahd Complex, 1405 AH).
    validations:
      required: true
